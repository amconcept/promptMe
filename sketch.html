<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Prompt Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="theme-manager.js?v=20260830br"></script>
    <style>
        :root {
            /* Default theme - will be overridden by editor theme system */
            --primary-color: #D2691E;
            --primary-hover: #CD853F;
            --primary-shadow: rgba(210, 105, 30, 0.3);
            --primary-shadow-hover: rgba(210, 105, 30, 0.5);
            --primary-shadow-light: rgba(210, 105, 30, 0.1);
            --accent-color: #FF7F7F;
            --background-color: #000000;
            --on-primary-color: var(--background-color);
            --text-color: #FFFFFF;
            --border-color: #333;
            --delete-color: var(--primary-color); /* D5: follows theme primary, not a warning red */
            --frame-color: #D2691E;
            --frame-border: #D2691E;
            --frame-background: #000000;
            --ui-font: 'VT323', monospace;
            --ui-font-size: 18px;
            --ui-font-style: normal;
            --ui-font-weight: 400;
            --stroke-width: 1px;
            --panel-stroke-width: 2px;
            --card-stroke-width: 4px;
        }

        html, body, canvas {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
        }
        body {
            overflow: hidden;
            font-family: var(--ui-font, 'VT323', monospace);
            color: var(--text-color);
        }
        /* Under the HTML chrome (tools / NEXT / RUN) so a later paint cannot cover labels. */
        canvas {
            display: block;
            position: relative;
            z-index: 0;
        }

        /* Theme picker CSS removed - now controlled by editor */

        /* Retro checkbox styling */
        .category-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        .category-checkbox:checked {
            background-color: var(--primary-color);
        }

        .category-checkbox:checked::after {
            content: '';
        }

        #all-categories-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        #all-categories-checkbox:checked {
            background-color: var(--primary-color);
        }

        /* Legacy >EDITOR hidden — replaced by top "edit" tool */
        .design-prompts-section { display: none !important; }

        /* RUN — fixed to viewport bottom; z above canvas / p5 DOM */
        .sketch-run {
            display: flex !important;
            position: fixed !important;
            left: 50%;
            bottom: max(14px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background: var(--primary-color);
            color: var(--on-primary-color, var(--background-color));
            /* D-054: explicit paper token — currentColor on <button> can paint ink */
            -webkit-text-fill-color: var(--on-primary-color, var(--background-color));
            font-family: 'VT323', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* After a run, waiting for GO TO NEXT — outline only (title-bright, not filled) */
        .sketch-run.sketch-run-muted {
            background: var(--background-color);
            color: var(--primary-color);
            -webkit-text-fill-color: var(--primary-color);
            font-size: 12px;
            letter-spacing: 0.02em;
            opacity: 0.85;
        }

        .sketch-run:hover,
        .sketch-run:active {
            background: var(--background-color);
            color: var(--primary-color);
            -webkit-text-fill-color: var(--primary-color);
        }

        .sketch-run.sketch-run-muted:hover,
        .sketch-run.sketch-run-muted:active {
            background: var(--primary-color);
            color: var(--on-primary-color, var(--background-color));
            -webkit-text-fill-color: var(--on-primary-color, var(--background-color));
            opacity: 1;
        }

        /* GO TO NEXT — solid CTA (hidden until post-run reveal) */
        .sketch-next-btn {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.45em;
            background: var(--primary-color);
            color: var(--on-primary-color, var(--background-color));
            -webkit-text-fill-color: var(--on-primary-color, var(--background-color));
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            padding: 7px 14px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.06em;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: visible;
        }

        .sketch-next-btn .sketch-next-sq {
            display: inline-block;
            width: 0.5em;
            height: 0.5em;
            background: var(--on-primary-color, var(--background-color));
            flex-shrink: 0;
        }

        .sketch-next-btn .sketch-next-label {
            color: var(--on-primary-color, var(--background-color));
            -webkit-text-fill-color: var(--on-primary-color, var(--background-color));
            font-weight: bold;
            line-height: 1;
        }

        /* D-063: grouping labels between tools and GO TO NEXT (Students pick grouping). */
        .sketch-grouping-picker {
            position: absolute;
            z-index: 5000;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            overflow-x: auto;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .sketch-grouping-picker[hidden] {
            display: none !important;
        }
        .sketch-grouping-chip {
            flex: 0 0 auto;
            max-width: 140px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            background: var(--background-color);
            color: var(--primary-color);
            -webkit-text-fill-color: var(--primary-color);
            font-family: var(--ui-font, 'VT323', monospace);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.04em;
            line-height: 30px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .sketch-grouping-chip[aria-checked="true"] {
            background: var(--primary-color);
            color: var(--on-primary-color, var(--background-color));
            -webkit-text-fill-color: var(--on-primary-color, var(--background-color));
        }
    </style>
    <script>
        if (typeof applyThemeFromStorage === 'function') applyThemeFromStorage();
    </script>
</head>
<body>
    <!-- Phone RUN (same action as UP arrow); edit is in the top tool strip -->
    <button type="button" id="sketch-run-btn" class="sketch-run" onclick="runSketchFromButton()" aria-label="Generate prompts">RUN</button>
    <div id="grouping-picker" class="sketch-grouping-picker" hidden role="radiogroup" aria-label="Grouping"></div>
    
    <!-- Load modules (theme-manager already in <head>) -->
    <script src="image-store.js?v=20260830br"></script>
    <script src="activity-pack.js?v=20260830br"></script>
    <script src="ui-manager.js?v=20260830br"></script>
    <script src="reveal-animation.js?v=20260830br"></script>
    <script src="animation-manager.js?v=20260830br"></script>
    <script src="data-manager.js?v=20260830br"></script>
    <script src="student-manager.js?v=20260830br"></script>
    <script src="prompt-generator.js?v=20260830br"></script>
    <script src="sketch-refactored.js?v=20260830br"></script>
    <script>
        console.log('PromptMe sketch build 20260830br');
        // Phone RUN → same path as UP arrow
        function runSketchFromButton() {
            if (window.pixelReveal && window.pixelReveal.active
                && typeof window.skipRevealToResult === 'function') {
                window.skipRevealToResult();
                return;
            }
            if (typeof window.triggerPromptRun === 'function') {
                window.triggerPromptRun();
            }
        }
        window.runSketchFromButton = runSketchFromButton;
        // If a cached HTML shell omitted the button, inject it now
        if (typeof window.ensureSketchRunButton === 'function') window.ensureSketchRunButton();
    </script>
</body>
</html>
