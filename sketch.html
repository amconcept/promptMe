<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="theme-manager.js"></script>
    <style>
        :root {
            /* Default theme - will be overridden by editor theme system */
            --primary-color: #D2691E;
            --primary-hover: #CD853F;
            --primary-shadow: rgba(210, 105, 30, 0.3);
            --primary-shadow-hover: rgba(210, 105, 30, 0.5);
            --primary-shadow-light: rgba(210, 105, 30, 0.1);
            --accent-color: #FF7F7F;
            --background-color: #000000;
            --text-color: #FFFFFF;
            --border-color: #333;
            --delete-color: #FF6B6B;
            --frame-color: #D2691E;
            --frame-border: #D2691E;
            --frame-background: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'VT323', monospace;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        canvas {
            display: block;
        }

        /* Theme picker CSS removed - now controlled by editor */

        /* Retro checkbox styling */
        .category-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        .category-checkbox:checked {
            background-color: var(--primary-color);
        }

        .category-checkbox:checked::after {
            content: '';
        }

        #all-categories-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        #all-categories-checkbox:checked {
            background-color: var(--primary-color);
        }

        /* >EDITOR — positioned by ui-manager.js to avoid overlapping nav arrows */
        .design-prompts-section {
            position: fixed;
            bottom: max(20px, 3vh);
            right: max(20px, 3vw);
            left: auto;
            z-index: 1000;
            pointer-events: none; /* section box doesn't steal taps */
        }

        .design-prompts {
            pointer-events: auto;
            background-color: var(--primary-color);
            color: var(--background-color);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            font-size: 22px;
            font-family: 'VT323', monospace;
            font-weight: normal;
            padding: 10px 16px;
            width: auto;
            min-width: 0;
            height: auto;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            margin: 0;
            white-space: nowrap;
        }
        
        @media (max-width: 768px) {
            .design-prompts {
                font-size: 16px;
                padding: 8px 12px;
            }
        }
        
        .design-prompts:hover {
            background-color: var(--background-color);
            color: var(--primary-color);
        }

        /* Phone RUN — mirrors editor cube-run; positioned by ui-manager.js */
        .sketch-run {
            display: none;
            position: fixed;
            left: 16px;
            bottom: 80px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background: var(--primary-color);
            color: var(--background-color);
            font-family: 'VT323', monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .sketch-run:hover,
        .sketch-run:active {
            background: var(--background-color);
            color: var(--primary-color);
        }

        @media (max-width: 768px),
               ((max-width: 900px) and (max-aspect-ratio: 3/4)) {
            .sketch-run {
                display: flex;
            }
        }
    </style>
    <script>
        if (typeof applyThemeFromStorage === 'function') applyThemeFromStorage();
    </script>
</head>
<body>
    <!-- Phone RUN (same action as UP arrow); >EDITOR bottom-right -->
    <button type="button" id="sketch-run-btn" class="sketch-run" onclick="runSketchFromButton()" aria-label="Generate prompts">RUN</button>
    <div class="design-prompts-section">
        <button class="design-prompts" onclick="goToEditor()">&gt;EDITOR</button>
    </div>
    
    <!-- Load modules (theme-manager already in <head>) -->
    <script src="ui-manager.js?v=20260725k"></script>
    <script src="animation-manager.js?v=20260725k"></script>
    <script src="data-manager.js?v=20260725k"></script>
    <script src="student-manager.js?v=20260725k"></script>
    <script src="prompt-generator.js?v=20260725k"></script>
    <script src="sketch-refactored.js?v=20260725k"></script>
    <script>
        console.log('PromptMe sketch build 20260725k');
        // Phone RUN → same path as UP arrow
        function runSketchFromButton() {
            if (window.playClickSound) window.playClickSound();
            if (typeof window.triggerPromptRun === 'function') {
                window.triggerPromptRun();
            }
        }
        window.runSketchFromButton = runSketchFromButton;
    </script>
</body>
</html>
