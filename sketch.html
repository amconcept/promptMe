<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Prompt Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="theme-manager.js"></script>
    <style>
        :root {
            /* Default theme - will be overridden by editor theme system */
            --primary-color: #D2691E;
            --primary-hover: #CD853F;
            --primary-shadow: rgba(210, 105, 30, 0.3);
            --primary-shadow-hover: rgba(210, 105, 30, 0.5);
            --primary-shadow-light: rgba(210, 105, 30, 0.1);
            --accent-color: #FF7F7F;
            --background-color: #000000;
            --text-color: #FFFFFF;
            --border-color: #333;
            --delete-color: #FF6B6B;
            --frame-color: #D2691E;
            --frame-border: #D2691E;
            --frame-background: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'VT323', monospace;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        canvas {
            display: block;
        }

        /* Theme picker CSS removed - now controlled by editor */

        /* Retro checkbox styling */
        .category-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        .category-checkbox:checked {
            background-color: var(--primary-color);
        }

        .category-checkbox:checked::after {
            content: '';
        }

        #all-categories-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid var(--primary-color);
            background-color: var(--background-color);
            cursor: pointer;
            position: relative;
        }

        #all-categories-checkbox:checked {
            background-color: var(--primary-color);
        }

        /* Legacy >EDITOR hidden — replaced by top "edit" tool */
        .design-prompts-section { display: none !important; }

        /* RUN — fixed to viewport bottom; z above canvas / p5 DOM */
        .sketch-run {
            display: flex !important;
            position: fixed !important;
            left: 50%;
            bottom: max(14px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
            background: var(--primary-color);
            color: #000000;
            font-family: 'VT323', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* After a run, waiting for GO TO NEXT — outline only (title-bright, not filled) */
        .sketch-run.sketch-run-muted {
            background: var(--background-color);
            color: var(--primary-color);
            font-size: 12px;
            letter-spacing: 0.02em;
            opacity: 0.85;
        }

        .sketch-run:hover,
        .sketch-run:active {
            background: var(--background-color);
            color: var(--primary-color);
        }

        .sketch-run.sketch-run-muted:hover,
        .sketch-run.sketch-run-muted:active {
            background: var(--primary-color);
            color: #000000;
            opacity: 1;
        }

        /* GO TO NEXT — solid CTA (hidden until post-run reveal) */
        .sketch-next-btn {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.45em;
            background: var(--primary-color);
            color: #000000;
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            padding: 7px 14px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.06em;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .sketch-next-btn .sketch-next-sq {
            display: inline-block;
            width: 0.5em;
            height: 0.5em;
            background: #000000;
            flex-shrink: 0;
        }

        .sketch-next-btn .sketch-next-label {
            color: #000000;
            font-weight: bold;
            line-height: 1;
        }
    </style>
    <script>
        if (typeof applyThemeFromStorage === 'function') applyThemeFromStorage();
    </script>
</head>
<body>
    <!-- Phone RUN (same action as UP arrow); edit is in the top tool strip -->
    <button type="button" id="sketch-run-btn" class="sketch-run" onclick="runSketchFromButton()" aria-label="Generate prompts">RUN</button>
    
    <!-- Load modules (theme-manager already in <head>) -->
    <script src="ui-manager.js?v=20260726q"></script>
    <script src="animation-manager.js?v=20260726q"></script>
    <script src="data-manager.js?v=20260726q"></script>
    <script src="student-manager.js?v=20260726q"></script>
    <script src="prompt-generator.js?v=20260726q"></script>
    <script src="sketch-refactored.js?v=20260726q"></script>
    <script>
        console.log('PromptMe sketch build 20260726q');
        // Phone RUN → same path as UP arrow
        function runSketchFromButton() {
            if (window.playClickSound) window.playClickSound();
            if (typeof window.triggerPromptRun === 'function') {
                window.triggerPromptRun();
            }
        }
        window.runSketchFromButton = runSketchFromButton;
        // If a cached HTML shell omitted the button, inject it now
        if (typeof window.ensureSketchRunButton === 'function') window.ensureSketchRunButton();
    </script>
</body>
</html>
